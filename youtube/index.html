<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Database</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    
    <header class="yt-header">
        <div class="yt-logo">▶ YouTube API</div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search">
            <button id="searchBtn">🔍</button>
        </div>
        
        <div class="spacer"></div>
    </header>

    <main class="yt-main">
        <div id="resultDisplay" class="hidden">
            <img id="coverArt" src="" alt="Video Cover">
            
            <div class="track-info">
                <h2 id="videoTitle">Loading...</h2>
                <p id="channelName">Channel Name</p>
                <a id="videoLink" href="#" target="_blank" class="play-btn">Watch</a>
            </div>
        </div>
    </main>

    <script src="youtube.js"></script>
</body>
</html>
