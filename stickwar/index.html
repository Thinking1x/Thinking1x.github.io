<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stick War Classic</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 800px; 
            height: 600px;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            
            // Keep our autoplay fixes to bypass the giant black play button
            player.config = {
                autoplay: "on",             
                unmuteOverlay: "hidden",    
                splashScreen: false         
            };
            
            document.getElementById("game-container").appendChild(player);
            
            // Simply load the file directly! No complex fetching required.
            player.load("stick_war_1.swf"); 
        });
    </script>
    
</body>
</html>
