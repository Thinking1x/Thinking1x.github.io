<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stick War Classic</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 800px; 
            height: 600px;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container"></div>

<script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", async () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        
        player.config = {
            autoplay: "on",             
            unmuteOverlay: "hidden",    
            splashScreen: false         
        };
        
        document.getElementById("game-container").appendChild(player);
        
        // ==========================================
        // THE SITELOCK BYPASS (WITH DEBUGGING)
        // ==========================================
        try {
            console.log("1. Attempting to fetch the SWF file from GitHub Pages...");
            
            // Using the ABSOLUTE URL to guarantee we hit the right server
            const response = await fetch("https://thinking1x.github.io/stickwar/Stick_Empires.swf"); 
            
            // If GitHub throws a 404, this stops Ruffle from eating the error page
            if (!response.ok) {
                throw new Error(`GitHub returned a ${response.status} error. The file path or name is incorrect.`);
            }

            console.log("2. File found! Converting to binary data...");
            const rawGameData = await response.arrayBuffer();

            console.log("3. Feeding data to Ruffle and spoofing the domain...");
            player.load({
                data: rawGameData,
                url: "http://www.stickpage.com/Stick_Empires.swf"
            });
            
        } catch (error) {
            // This will print the exact failure reason in bright red in your F12 console
            console.error("CRITICAL FETCH ERROR:", error.message);
        }
    });
</script>
    
</body>
</html>
