<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stick War Classic</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 800px; 
            height: 600px;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", async () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            
            // Keep our autoplay fixes
            player.config = {
                autoplay: "on",             
                unmuteOverlay: "hidden",    
                splashScreen: false         
            };
            
            document.getElementById("game-container").appendChild(player);
            
            // ==========================================
            // THE SITELOCK BYPASS (DOMAIN SPOOFING)
            // ==========================================
            try {
                // 1. Fetch your local game file as raw binary data
                // CHANGE THIS NAME if your file is named something else!
                const response = await fetch("Stick_Empires.swf"); 
                const rawGameData = await response.arrayBuffer();

                // 2. Feed the raw data to Ruffle, but attach a fake URL
                player.load({
                    data: rawGameData,
                    
                    // 3. The Magic Lie: 
                    // This is the URL the game's internal code will see when it checks for piracy.
                    url: "http://www.stickpage.com/Stick_Empires.swf"
                });
                
            } catch (error) {
                console.error("Failed to load the game data:", error);
            }
        });
    </script>
    
</body>
</html>
