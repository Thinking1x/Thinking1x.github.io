<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stick War Classic</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 800px; 
            height: 600px;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="game-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            
            // --- THE FIX: Ruffle Configuration ---
            player.config = {
                autoplay: "on",             // Forces the game to start without the play button
                unmuteOverlay: "hidden",    // Hides the "Click to unmute" banner
                splashScreen: false         // Disables the Ruffle loading screen logo
            };
            
            const container = document.getElementById("game-container");
            container.appendChild(player);
            
            player.load("Stick_War_1.swf"); 
        });
    </script>
    
</body>
</html>
